<script>
const MOONS = [{"id": "miranda", "name": {"zh": "米兰达", "en": "Miranda"}, "group": "major", "img": "img/miranda.jpg", "diam": "471.6 km", "axis": "129,846 km", "period": {"zh": "1.41 天", "en": "1.41 d"}, "discovered": {"zh": "1948 · 杰拉德·柯伊伯", "en": "1948 · Gerard Kuiper"}, "note": {"zh": "天卫五", "en": "Uranus V"}, "desc": {"zh": "五颗主卫星中最小的一颗，表面却极其破碎、地质历史复杂。其“维罗纳断崖”（Verona Rupes）高达约 20 公里，是太阳系已知最高的悬崖；巨大的人字形（chevron）地貌与混杂的断裂地形，暗示它可能经历过剧烈的撞击碎裂与重新拼合。", "en": "The smallest of the five major moons, Miranda has a remarkably fractured surface and a complex history. Its Verona Rupes cliff rises about 20 km — the tallest known cliff in the Solar System — while giant chevron-shaped features and chaotic faulted terrain hint at a violent past of shattering and re-accretion."}, "roman": "V", "pron": "/məˈrændə/", "magn": "3.5", "mass": "6,293", "incl": "4.421°", "ecc": "0.0014", "dims": "481 × 468 × 466 km", "diam_precise": "471.6 ± 1.4 km", "announced": "1948", "disc_year": "1948", "retro": false, "discoverer": {"zh": "杰拉德·柯伊伯", "en": "Gerard Kuiper"}, "naming": {"zh": "莎士比亚《暴风雨》中普洛斯彼罗的女儿", "en": "Prospero's daughter in Shakespeare's The Tempest"}, "long_desc": {"zh": "天王星五颗主卫星中最小、也最靠内的一颗，直径仅约 472 公里，却是太阳系中地质最复杂的天体之一。它的表面由截然不同的地形拼合而成——高反照率的起伏丘陵、低平的撞击平原，以及三个巨大的卵形“王冠”（coronae）地貌：阿登（Arden）、埃尔西诺（Elsinore）与因弗内斯（Inverness）。其中最震撼的是维罗纳断崖（Verona Rupes），落差高达约 20 公里，是太阳系已知最高的悬崖——若从崖顶自由下落，约需 12 分钟才能触底。这种新老地形混杂的格局，暗示米兰达可能曾遭巨大撞击而彻底碎裂，随后又在引力作用下重新拼合。它由杰拉德·柯伊伯于 1948 年发现，是天王星主卫星中唯一由美国天文学家发现的一颗。", "en": "The smallest and innermost of Uranus's five major moons, at only ~472 km across, Miranda is nonetheless one of the most geologically complex bodies in the Solar System. Its surface is a patchwork of strikingly different terrains — bright rolling hills, low cratered plains, and three huge ovoid 'coronae' (Arden, Elsinore and Inverness). Most dramatic is Verona Rupes, a cliff rising about 20 km — the tallest known cliff in the Solar System — from whose top a free-falling object would take roughly 12 minutes to reach the bottom. This mix of ancient and young terrain suggests Miranda may once have been shattered by a giant impact and re-accreted. Discovered in 1948 by Gerard Kuiper, it is the only major Uranian moon found by an American astronomer."}, "gallery": [{"img": "img/miranda_2.jpg", "zh": "米兰达最高分辨率彩色影像", "en": "Highest-resolution colour image"}, {"img": "img/miranda_3.jpg", "zh": "米兰达高分辨率马赛克", "en": "High-resolution mosaic"}, {"img": "img/miranda_4.jpg", "zh": "米兰达大断层特写", "en": "Large fault close-up"}]}, {"id": "ariel", "name": {"zh": "阿里尔", "en": "Ariel"}, "group": "major", "img": "img/ariel.jpg", "diam": "1,157.8 km", "axis": "190,929 km", "period": {"zh": "2.52 天", "en": "2.52 d"}, "discovered": {"zh": "1851 · 威廉·拉塞尔", "en": "1851 · William Lassell"}, "note": {"zh": "天卫一", "en": "Uranus I"}, "desc": {"zh": "五颗主卫星中表面最亮、也最年轻的一颗。遍布深邃的峡谷与裂谷，冰与岩石混合，平坦谷底暗示可能存在过（甚至仍在进行）的冰火山活动，是研究天王星卫星地质演化的关键对象。", "en": "The brightest and youngest surface among the major moons. Ariel is crossed by deep canyons and rift valleys of mixed ice and rock; smooth valley floors hint at past — possibly ongoing — cryovolcanic activity, making it key to understanding the moons' geological evolution."}, "roman": "I", "pron": "/ˈɛəriəl/", "magn": "1.0", "mass": "123,310", "incl": "0.026°", "ecc": "0.0014", "dims": "1162 × 1156 × 1155 km", "diam_precise": "1157.8 ± 1.2 km", "announced": "1851", "disc_year": "1851", "retro": false, "discoverer": {"zh": "威廉·拉塞尔", "en": "William Lassell"}, "naming": {"zh": "莎士比亚《暴风雨》中的空气精灵", "en": "the airy spirit in Shakespeare's The Tempest"}, "long_desc": {"zh": "天王星主卫星中表面最亮、也最年轻的一颗，直径约 1,158 公里。其表面遍布深邃的峡谷与裂谷系统（chasmata），纵横交错的断层切割出壮观的崖壁与凹槽；许多谷底异常平坦，暗示曾（甚至可能仍在）发生冰火山活动——低温的冰-氨熔体涌出并填平了低地。与姐妹们相比，阿丽尔的撞击坑明显偏少，说明它的地表经历过较年轻的地质重塑。它由威廉·拉塞尔于 1851 年发现（与乌姆柏里厄尔同年），以《暴风雨》中的空气精灵命名。", "en": "The brightest and youngest-surfaced of Uranus's major moons, at ~1,158 km across. Ariel is crossed by a network of deep canyons and rift valleys (chasmata), whose intersecting faults carve spectacular cliffs and grooves; many valley floors are remarkably smooth, hinting at past — possibly ongoing — cryovolcanism, in which low-temperature ice–ammonia melts welled up and resurfaced the lowlands. Its crater count is conspicuously lower than its sisters', pointing to comparatively recent geological resurfacing. Discovered in 1851 by William Lassell (the same year as Umbriel), it is named after the airy spirit in The Tempest."}, "gallery": [{"img": "img/ariel_2.jpg", "zh": "阿里尔最近距离影像", "en": "Voyager closest approach"}, {"img": "img/ariel_3.jpg", "zh": "阿里尔最高分辨率彩色影像", "en": "Highest-resolution colour image"}]}, {"id": "umbriel", "name": {"zh": "乌姆柏里厄尔", "en": "Umbriel"}, "group": "major", "img": "img/umbriel.jpg", "diam": "1,169.4 km", "axis": "265,986 km", "period": {"zh": "4.14 天", "en": "4.14 d"}, "discovered": {"zh": "1851 · 威廉·拉塞尔", "en": "1851 · William Lassell"}, "note": {"zh": "天卫二", "en": "Uranus II"}, "desc": {"zh": "五颗主卫星中最暗的一颗，表面古老而布满撞击坑。最醒目的特征是沃达撞击坑（Wunda）——坑底有一圈明亮的高反照率物质，在暗色地表上格外耀眼，成因至今仍是个谜。", "en": "The darkest of the five major moons, Umbriel has an ancient, heavily cratered surface. Its most striking feature is the crater Wunda, whose floor bears a bright ring of high-albedo material that stands out sharply against the dark terrain — its origin remains a mystery."}, "roman": "II", "pron": "/ˈʌmbriəl/", "magn": "1.7", "mass": "128,850", "incl": "0.083°", "ecc": "0.0039", "dims": "", "diam_precise": "1169.4 ± 5.6 km", "announced": "1851", "disc_year": "1851", "retro": false, "discoverer": {"zh": "威廉·拉塞尔", "en": "William Lassell"}, "naming": {"zh": "蒲柏《夺发记》中忧郁的叹息精灵", "en": "the dusky melancholy sprite in Pope's The Rape of the Lock"}, "long_desc": {"zh": "五颗主卫星中最暗的一颗，直径约 1,169 公里，表面古老、黯淡（反照率仅约 0.1），遍布撞击坑。最引人注目的是沃达撞击坑（Wunda）：坑底铺着一圈明亮的高反照率物质——一个直径约 140 公里的白色亮环，在黑暗的地表上格外耀眼，其成因至今尚无定论。它由威廉·拉塞尔于 1851 年发现，以蒲柏长诗《夺发记》中“忧郁的叹息精灵”命名。", "en": "The darkest of the five major moons, at ~1,169 km across, with an old, dim surface (albedo only ~0.1) pockmarked by craters. Its most striking feature is the crater Wunda, whose floor is ringed by bright, high-albedo material — a roughly 140-km white halo that stands out vividly against the dark terrain, and whose origin remains unresolved. Discovered in 1851 by William Lassell, it is named after the 'dusky melancholy sprite' in Pope's The Rape of the Lock."}, "gallery": [{"img": "img/umbriel_2.jpg", "zh": "乌姆柏里厄尔最近距离影像", "en": "Closest approach"}]}, {"id": "titania", "name": {"zh": "泰坦尼亚", "en": "Titania"}, "group": "major", "img": "img/titania.jpg", "diam": "1,576.8 km", "axis": "436,298 km", "period": {"zh": "8.71 天", "en": "8.71 d"}, "discovered": {"zh": "1787 · 威廉·赫歇尔", "en": "1787 · William Herschel"}, "note": {"zh": "天卫三", "en": "Uranus III"}, "desc": {"zh": "天王星最大的卫星，也是太阳系第八大卫星。表面有长达千公里的巨大峡谷断层（如墨西拿峡谷 Messina Chasma），并可能有冰火山活动的痕迹，整体由冰与岩石大致各半组成。", "en": "The largest moon of Uranus and the eighth-largest in the Solar System. Titania is cut by enormous canyon systems up to a thousand kilometres long (e.g. Messina Chasma) and shows possible signs of cryovolcanism, being composed of roughly equal parts ice and rock."}, "roman": "III", "pron": "/təˈtɑːniə/", "magn": "0.8", "mass": "345,500", "incl": "0.114°", "ecc": "0.0016", "dims": "", "diam_precise": "1576.8 ± 1.2 km", "announced": "1787", "disc_year": "1787", "retro": false, "discoverer": {"zh": "威廉·赫歇尔", "en": "William Herschel"}, "naming": {"zh": "莎士比亚《仲夏夜之梦》中的仙后", "en": "the Fairy Queen in Shakespeare's A Midsummer Night's Dream"}, "long_desc": {"zh": "天王星最大的卫星，也是太阳系第八大卫星，直径约 1,577 公里，由冰与岩石大致各半构成。它被多条巨大的峡谷断层切割，其中最壮观的是墨西拿峡谷（Messina Chasma），绵延约 1,500 公里，长度接近地球月球的半径。表面撞击坑与断层交错，局部地形暗示可能存在过冰火山活动。它由威廉·赫歇尔于 1787 年与欧贝隆同日发现，是天王星最早被发现的卫星，以《仲夏夜之梦》中的仙后命名。", "en": "The largest moon of Uranus and the eighth-largest in the Solar System, at ~1,577 km across, composed of roughly equal parts ice and rock. It is carved by several great canyon systems, the grandest being Messina Chasma, which stretches some 1,500 km — nearly the radius of Earth's Moon. Craters and faults criss-cross its surface, with local relief suggesting possible past cryovolcanism. Discovered by William Herschel in 1787 (on the same night as Oberon), it was the first Uranian moon ever found, and is named after the Fairy Queen in A Midsummer Night's Dream."}, "gallery": [{"img": "img/titania_2.jpg", "zh": "泰坦尼亚高分辨率彩色合成", "en": "High-resolution colour composite"}, {"img": "img/titania_3.jpg", "zh": "泰坦尼亚最高分辨率影像", "en": "Highest-resolution image"}]}, {"id": "oberon", "name": {"zh": "欧贝隆", "en": "Oberon"}, "group": "major", "img": "img/oberon.jpg", "diam": "1,522.8 km", "axis": "583,511 km", "period": {"zh": "13.46 天", "en": "13.46 d"}, "discovered": {"zh": "1787 · 威廉·赫歇尔", "en": "1787 · William Herschel"}, "note": {"zh": "天卫四", "en": "Uranus IV"}, "desc": {"zh": "五颗主卫星中离天王星最远的一颗，表面古老、撞击坑密布，坑底常见暗色沉积物，部分大坑中央又有高反差的明亮物质，显示出复杂而悠久的撞击历史。", "en": "The outermost of the major moons, Oberon has an old, densely cratered surface. Many craters hold dark deposits on their floors, while some large craters show bright material at their centres, recording a long and complex impact history."}, "roman": "IV", "pron": "/ˈoʊbərɒn/", "magn": "1.0", "mass": "311,040", "incl": "0.125°", "ecc": "0.0016", "dims": "", "diam_precise": "1522.8 ± 5.2 km", "announced": "1787", "disc_year": "1787", "retro": false, "discoverer": {"zh": "威廉·赫歇尔", "en": "William Herschel"}, "naming": {"zh": "莎士比亚《仲夏夜之梦》中的仙王", "en": "the Fairy King in Shakespeare's A Midsummer Night's Dream"}, "long_desc": {"zh": "五颗主卫星中离天王星最远的一颗，直径约 1,523 公里，表面古老，撞击坑极为密集。许多大坑的坑底覆盖着暗色物质——一种富含有机物的“脏冰”沉积，可能是从卫星内部涌出的液态水所携带；部分大坑中央又出现明亮的高反照率物质，显示出复杂而悠久的撞击与地质历史。它由威廉·赫歇尔于 1787 年发现，以《仲夏夜之梦》中的仙王命名。", "en": "The outermost of the five major moons, at ~1,523 km across, with an ancient surface so densely cratered it appears saturated. Many large craters hold dark deposits on their floors — 'dirty ice' rich in organic material, possibly emplaced by liquid water welling up from the interior — while some craters const ORBIT = ["cordelia", "ophelia", "s2025u1", "bianca", "cressida", "desdemona", "juliet", "portia", "rosalind", "cupid", "belinda", "perdita", "puck", "mab", "miranda", "ariel", "umbriel", "titania", "oberon", "francisco", "caliban", "stephano", "s2023u1", "trinculo", "sycorax", "margaret", "prospero", "setebos", "ferdinand"];
let LANG = 'zh';

function t(k) { const e = I18N[k]; return e ? (e[LANG] || e.zh) : k; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getMoon() {
  const id = new URLSearchParams(location.search).get('id');
  return MOONS.find(x => x.id === id) || MOONS[0];
}

function ordered() {
  const rank = new Map(ORBIT.map((id, i) => [id, i]));
  return [...MOONS].sort((a, b) => (rank.get(a.id) ?? 999) - (rank.get(b.id) ?? 999));
}

function moonFigure(m) {
  if (m.img) return '<img src="' + m.img + '" alt="' + esc(m.name[LANG]) + '">';
  return '<div class="noimg">' + t('noimg') + '</div>';
}

function buildData(m) {
  const rows = [];
  const add = (k, v) => { if (v !== undefined && v !== null && v !== '')
    rows.push('<dt>' + t(k) + '</dt><dd>' + v + '</dd>'); };
  add('f_group', t('group_' + m.group));
  if (m.roman) add('f_roman', (LANG === 'zh' ? '天王星卫星 ' : 'Uranus ') + m.roman);
  if (m.pron) add('f_pron', m.pron);
  add('f_diam', m.diam_precise || m.diam);
  add('f_dims', m.dims);
  add('f_mass', m.mass + ' ' + t('mass_unit'));
  add('f_magn', m.magn);
  add('f_axis', m.axis);
  add('f_period', m.period[LANG]);
  add('f_incl', m.incl);
  add('f_ecc', m.ecc);
  add('f_disc', m.disc_year);
  add('f_announced', m.announced);
  add('f_discoverer', m.discoverer ? m.discoverer[LANG] : '');
  add('f_naming', m.naming ? m.naming[LANG] : '');
  return rows.join('');
}

function buildGallery(m) {
  if (!m.gallery || !m.gallery.length) return '<p class="no-gallery">' + t('no_gallery') + '</p>';
  return m.gallery.map(g => {
    const cap = LANG === 'zh' ? g.zh : g.en;
    return '<figure class="g-item"><div class="g-img"><img src="' + g.img + '" alt="' + esc(cap) + '" loading="lazy"></div>' +
      '<figcaption>' + esc(cap) + '</figcaption></figure>';
  }).join('');
}

function buildNav(m) {
  const list = ordered();
  const i = list.findIndex(x => x.id === m.id);
  const prev = list[(i - 1 + list.length) % list.length];
  const next = list[(i + 1) % list.length];
  document.getElementById('prevLink').href = 'moon.html?id=' + prev.id;
  document.getElementById('nextLink').href = 'moon.html?id=' + next.id;
  document.getElementById('prevName').textContent = prev.name[LANG];
  document.getElementById('nextName').textContent = next.name[LANG];
}

function render() {
  const m = getMoon();
  const other = LANG === 'zh' ? 'en' : 'zh';
  document.title = m.name[LANG] + ' · ' + t('of_uranus');
  document.getElementById('moonName').innerHTML = esc(m.name[LANG]) + ' <span class="en">' + esc(m.name[other]) + '</span>';
  const note = document.getElementById('moonNote');
  note.textContent = m.note[LANG];
  note.className = 'tag ' + m.group;
  document.getElementById('moonFigure').innerHTML = moonFigure(m);
  document.getElementById('moonDesc').textContent = (m.long_desc ? m.long_desc[LANG] : m.desc[LANG]);
  document.getElementById('dataTable').innerHTML = buildData(m);
  document.getElementById('galleryGrid').innerHTML = buildGallery(m);
  buildNav(m);
  document.getElementById('btnZh').classList.toggle('on', LANG === 'zh');
  document.getElementById('btnEn').classList.toggle('on', LANG === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
}

function setLang(l) { LANG = l; render(); }
window.addEventListener('DOMContentLoaded', () => {
  render();
  document.getElementById('btnZh').addEventListener('click', () => setLang('zh'));
  document.getElementById('btnEn').addEventListener('click', () => setLang('en'));
});
</script>
